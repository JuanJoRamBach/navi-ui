name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # .gitattributes tracks most binary types (png, fonts, etc.)
          # via Git LFS; without this, checkout leaves them as raw LFS
          # pointer text instead of the real file, which then gets
          # copied verbatim into dist/ and deployed as-is — e.g.
          # icon-192.png/icon-512.png were being served as a 130-byte
          # text pointer, not a real image (JuanJo, 2026-09-01: PWA
          # install showed no icon).
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
